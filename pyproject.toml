[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microdhcp"
version = "1.0.0"
description = "Tiny DHCP information viewer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
microdhcp = "microdhcp.cli:main"

[tool.setuptools]
packages = ["microdhcp"]
